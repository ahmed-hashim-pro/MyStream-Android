if (getGradle().getStartParameter().getTaskRequests().toString().contains("Release") &&
        !project.hasProperty("disableFirebase") && !project.hasProperty("disableCrashlytics")) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
}

// Release signing. Credentials are read from a gitignored keystore.properties and are
// NEVER committed — the file, and any .jks/.keystore, are in .gitignore. To sign, create
// keystore.properties next to this build file (see keystore.properties.example):
//
//   storeFile=/absolute/path/to/upload-keystore.jks
//   storePassword=...
//   keyAlias=...
//   keyPassword=...
//
// CI can supply the same four values as environment variables instead
// (MYSTREAM_STORE_FILE / _STORE_PASSWORD / _KEY_ALIAS / _KEY_PASSWORD).
//
// When neither source is present the release build still succeeds, but produces an
// UNSIGNED artifact that Play will reject — `hasReleaseSigning` below is what decides,
// so an absent keystore degrades loudly rather than silently signing with the debug key.
def keystorePropertiesFile = file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def signingValue = { String key, String envVar ->
    keystoreProperties.getProperty(key) ?: System.getenv(envVar)
}
def releaseStoreFile = signingValue("storeFile", "MYSTREAM_STORE_FILE")
def hasReleaseSigning = releaseStoreFile != null && file(releaseStoreFile).exists()
if (!hasReleaseSigning) {
    logger.warn("WARNING: no release keystore configured — :app:bundleMadaniRelease will "
            + "produce an UNSIGNED bundle that Google Play will reject. "
            + "See the signing comment in app/build.gradle.")
}

android {
    namespace "com.medoapps.www.onlinequran"
    // Screenshot-free UI testing: androidTest's BuildConfig is generated into `testNamespace`,
    // which defaults to namespace + ".test" — and that collides with the dead main-source
    // class `com.medoapps.www.onlinequran.test` ("package ... clashes with class of same
    // name"). Renaming it is what unblocks the androidTest compile.
    testNamespace "com.medoapps.www.onlinequran.androidtest"
    compileSdk 34
    lint {
        checkReleaseBuilds true
        abortOnError false
        warningsAsErrors false

        lintConfig file("lint.xml")
        enable "Interoperability"
    }

    defaultConfig {
        applicationId "com.medoapps.www.onlinequran"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 43
        versionName "13.0.0"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "com.medoapps.www.onlinequran.core.QuranTestRunner"
        // Screenshot-free UI testing: the default testApplicationId is applicationId + ".test",
        // which collides with the dead main-source class `com.medoapps.www.onlinequran.test`
        // ("package ... clashes with class of same name" when the androidTest BuildConfig
        // is generated). Renaming the instrumentation package unblocks androidTest compile.
        testApplicationId "com.medoapps.www.onlinequran.androidtest"

        buildConfigField "String", "ADMOB_AD_UNIT_ID", "\"ca-app-pub-9350633918697995/7533398267\""
        buildConfigField "String", "ADMOB_APP_ID", "\"ca-app-pub-9350633918697995~2524775865\""
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword signingValue("storePassword", "MYSTREAM_STORE_PASSWORD")
                keyAlias signingValue("keyAlias", "MYSTREAM_KEY_ALIAS")
                keyPassword signingValue("keyPassword", "MYSTREAM_KEY_PASSWORD")
            }
        }
    }
    flavorDimensions "pageType"
    productFlavors {

        madani {
            applicationId "com.medoapps.www.onlinequran"
        }
    }

    buildTypes {
        beta {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard.cfg'
//            signingConfig signingConfigs.release
            versionNameSuffix "-beta"
            matchingFallbacks = ['debug']
        }

       /* debug {
//            applicationIdSuffix ".debug"
//            versionNameSuffix "-debug"
        }*/
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard.cfg'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    applicationVariants.all { variant ->
        resValue "string", "authority", applicationId + '.data.QuranDataProvider'
        resValue "string", "file_authority", applicationId + '.fileprovider'
        mergedFlavor.manifestPlaceholders = [app_debug_label: "Quran " + flavorName.capitalize()]

        if (applicationId.endsWith("debug")) {
            mergedFlavor.manifestPlaceholders = [app_debug_label: "Quran " + flavorName.capitalize()]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
        freeCompilerArgs += [ "-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi" ]
    }

    // Screenshot-free UI testing: needed by Robolectric so unit tests can read merged resources.
    testOptions.unitTests.includeAndroidResources = true

    testOptions.unitTests.all {
        // Screenshot-free UI testing: let `-Droborazzi.test.record=true` reach the test JVM.
        systemProperty 'roborazzi.test.record', System.getProperty('roborazzi.test.record', 'false')
        systemProperty 'roborazzi.test.verify', System.getProperty('roborazzi.test.verify', 'false')
        testLogging {
            events 'passed', 'skipped', 'failed', 'standardOut', 'standardError'
            outputs.upToDateWhen { false }
            showStandardStreams true
            exceptionFormat "full"
        }
    }

    packaging {
        exclude "META-INF/*.kotlin_module"

        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/INDEX.LIST'
    }

    buildFeatures {
        viewBinding true
    }
}

// required so that Errorprone doesn't look at generated files
afterEvaluate {
    tasks.withType(JavaCompile).configureEach {
        options.errorprone.excludedPaths = ".*/build/generated/.*"
        options.errorprone.disableWarningsInGeneratedCode = true
    }
}

