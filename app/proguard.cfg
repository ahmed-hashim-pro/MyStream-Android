-ignorewarnings
-renamesourcefileattribute SourceFile
-keepattributes *Annotation*
-keepattributes SourceFile,LineNumberTable

# Gson resolves generics reflectively at runtime. StorageUtil builds anonymous
# TypeTokens — `new TypeToken<ArrayList<Post>>() {}` — and TypeToken reads its type
# argument from the class's Signature attribute. Without keeping Signature, R8 strips
# it and the constructor throws "java.lang.RuntimeException: Missing type parameter."
# That fires from MainActivity.onCreate, so the RELEASE build crashes on launch while
# debug (unminified) is fine. EnclosingMethod/InnerClasses are needed for the same
# reason: the TypeTokens are anonymous inner classes.
-keepattributes Signature
-keepattributes EnclosingMethod
-keepattributes InnerClasses

-keep class com.google.gson.reflect.TypeToken { *; }
-keep class * extends com.google.gson.reflect.TypeToken
-keep public class * implements java.lang.reflect.Type

# Gson maps JSON keys onto field NAMES, so these models must not be renamed —
# otherwise every previously-stored list silently decodes to nulls.
-keep class com.medoapps.www.onlinequran.Audio { *; }
-keep class com.medoapps.www.onlinequran.AuthorClass { *; }

# Firebase Realtime Database instantiates models reflectively: it needs a
# no-argument constructor and the original field/getter names. Stripping either
# throws at runtime, e.g.
#   DatabaseException: Class ... does not define a no-argument constructor
# Both model packages are kept. The app has TWO — `models` (Post, Comment, User,
# Report, Reporting) and `model` (Message, Room, Group, Friend, Status …) — and
# classes from each are handed to Firebase. Keeping only one produced a second
# crash on the Quran tab, so the rule covers every data package rather than the
# individual classes that happen to be reached today.
-keep class com.medoapps.www.onlinequran.models.** { *; }
-keep class com.medoapps.www.onlinequran.model.** { *; }
-keep class com.medoapps.www.onlinequran.data.** { *; }
-keepclassmembers class com.medoapps.www.onlinequran.models.** { <init>(); }
-keepclassmembers class com.medoapps.www.onlinequran.model.** { <init>(); }
-keepclassmembers class com.medoapps.www.onlinequran.data.** { <init>(); }
-keepclassmembers class * {
    @com.google.firebase.database.PropertyName *;
}

-keep public class * extends android.app.Activity
-keep public class * extends android.app.Application
-keep public class * extends android.app.Service
-keep public class * extends android.content.BroadcastReceiver
-keep public class * extends android.content.ContentProvider
-keep public class * extends android.view.View { public <init>(android.content.Context); public <init>(android.content.Context, android.util.AttributeSet); public <init>(android.content.Context, android.util.AttributeSet, int); public void set*(...); }
-keep class * extends android.preference.DialogPreference {
    public <init>(android.content.Context);
    public <init>(android.content.Context, android.util.AttributeSet);
    public <init>(android.content.Context, android.util.AttributeSet, int);
    public void set*(...);
}
-keepclassmembers class androidx.fragment.app.Fragment { *** getActivity(); public *** onCreate(); public *** onCreateOptionsMenu(...); }

# keep custom exceptions
-keep public class * extends java.lang.Exception

# don't warn for okio errors
-dontwarn okio.**

# rxjava
-dontwarn rx.**
-dontwarn sun.misc.**

-keepclassmembers class rx.internal.util.unsafe.*ArrayQueue*Field* {
   long producerIndex;
   long consumerIndex;
}

-keepclassmembers class rx.internal.util.unsafe.BaseLinkedQueueProducerNodeRef {
   long producerNode;
   long consumerNode;
}

# dnsjava
-keep class org.xbill.DNS.** { *; }

# quran - needed to avoid a crash on 4.0.2/4.0.3/4.0.4
-keep class com.medoapps.www.onlinequran.ui.util.ImageAyahUtils { *; }
