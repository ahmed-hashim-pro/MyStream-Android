<!-- ====== 18 · FULL-SCREEN AUDIO PLAYER ====== -->
<div class="phone-col">
  <div class="phone-cap">
    <div class="n" data-en="Audio Player" data-ar="مشغّل الصوت"></div>
    <div class="d" data-en="Full-screen recitation player" data-ar="مشغّل التلاوة بملء الشاشة"></div>
  </div>
  <div class="phone"><div class="notch"></div><div class="screen">
    <div class="sb on-navy"><span>9:41</span><span class="r"><span>5G</span><span class="sb-dots"></span><span>100</span></span></div>

    <div style="position:absolute;inset:0;background:linear-gradient(160deg,var(--navy-700),var(--navy-900));color:var(--on-navy);display:flex;flex-direction:column">

      <!-- top row -->
      <div class="between" style="padding:8px 14px 4px">
        <span class="ico" style="font-size:22px;color:var(--gold)">⌄</span>
        <div class="t" data-en="Now playing" data-ar="يُشغّل الآن" style="font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--on-navy-dim)"></div>
        <span class="ico" style="font-size:20px;color:var(--gold)">⋮</span>
      </div>

      <!-- artwork + titles -->
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px;gap:6px">
        <div style="width:180px;height:180px;border-radius:50%;border:3px solid var(--gold);background:radial-gradient(circle at 50% 38%,var(--navy-500),var(--navy-900));box-shadow:0 0 0 6px var(--gold-faint),var(--shadow);display:flex;align-items:center;justify-content:center;margin-bottom:18px">
          <span class="ar" style="font-family:'Amiri',serif;font-size:52px;color:var(--gold-light)">۩</span>
        </div>
        <div class="ar" style="font-family:'Amiri',serif;font-size:23px;font-weight:700;color:var(--on-navy)">سورة البقرة</div>
        <div class="t" data-en="Mishary Alafasy" data-ar="مشاري العفاسي" style="font-size:13px;font-weight:600;color:var(--on-navy-dim)"></div>
      </div>

      <!-- seek bar -->
      <div style="padding:0 24px 6px">
        <div style="height:5px;border-radius:5px;background:var(--gold-faint);position:relative">
          <i style="display:block;height:100%;width:38%;border-radius:5px;background:var(--gold)"></i>
          <span style="position:absolute;inset-inline-start:38%;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:var(--shadow-sm)"></span>
        </div>
        <div class="between" style="margin-top:8px;font-size:11px;font-weight:700;color:var(--on-navy-dim)">
          <span>1:02</span>
          <span>2:48</span>
        </div>
      </div>

      <!-- controls -->
      <div style="display:flex;align-items:center;justify-content:center;gap:22px;padding:8px 24px 30px">
        <span class="ctl" style="font-size:20px;color:var(--on-navy-dim)">🔀</span>
        <span class="ctl" style="font-size:24px;color:var(--on-navy)">⏮</span>
        <span class="play" style="width:64px;height:64px;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 10px 24px -8px var(--gold)">⏸</span>
        <span class="ctl fwd" style="font-size:24px;color:var(--on-navy)">⏭</span>
        <span class="ctl" style="font-size:20px;color:var(--on-navy-dim)">🔁</span>
      </div>

    </div>
  </div></div>
</div>
