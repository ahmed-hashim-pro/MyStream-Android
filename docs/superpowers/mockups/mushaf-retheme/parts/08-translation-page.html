      <!-- Ayah 1 -->
      <div style="display:flex;align-items:flex-start;gap:12px">
        <div class="num">1</div>
        <div style="flex:1;min-width:0">
          <div class="quran-inline" dir="rtl" style="font-size:21px;line-height:1.95;color:var(--text);text-align:right">الٓمٓ</div>
          <div style="font-size:13.5px;line-height:1.6;color:var(--text2);margin-top:8px" data-en="Alif, Lam, Meem." data-ar="الٓمٓ (حروف مقطّعة في أوائل بعض السور)"></div>
        </div>
      </div>
      <div style="height:1px;background:var(--line);margin:12px 0"></div>

      <!-- Ayah 2 -->
      <div style="display:flex;align-items:flex-start;gap:12px">
        <div class="num">2</div>
        <div style="flex:1;min-width:0">
          <div class="quran-inline" dir="rtl" style="font-size:21px;line-height:1.95;color:var(--text);text-align:right">ذَٰلِكَ ٱلْكِتَٰبُ لَا رَيْبَ ۛ فِيهِ ۛ هُدًى لِّلْمُتَّقِينَ</div>
          <div style="font-size:13.5px;line-height:1.6;color:var(--text2);margin-top:8px" data-en="This is the Book about which there is no doubt, a guidance for those conscious of Allah." data-ar="هذا القرآن لا شكَّ أنه من عند الله، هدايةٌ للمتقين."></div>
        </div>
      </div>
      <div style="height:1px;background:var(--line);margin:12px 0"></div>

      <!-- Ayah 3 -->
      <div style="display:flex;align-items:flex-start;gap:12px">
        <div class="num">3</div>
        <div style="flex:1;min-width:0">
          <div class="quran-inline" dir="rtl" style="font-size:21px;line-height:1.95;color:var(--text);text-align:right">ٱلَّذِينَ يُؤْمِنُونَ بِٱلْغَيْبِ وَيُقِيمُونَ ٱلصَّلَوٰةَ وَمِمَّا رَزَقْنَٰهُمْ يُنفِقُونَ</div>
          <div style="font-size:13.5px;line-height:1.6;color:var(--text2);margin-top:8px" data-en="Who believe in the unseen, establish prayer, and spend out of what We have provided for them." data-ar="الذين يصدِّقون بالغيب ويؤدُّون الصلاة وينفقون مما رزقناهم."></div>
        </div>
      </div>
      <div style="height:1px;background:var(--line);margin:12px 0"></div>

      <!-- Ayah 4 -->
      <div style="display:flex;align-items:flex-start;gap:12px">
        <div class="num">4</div>
        <div style="flex:1;min-width:0">
          <div class="quran-inline" dir="rtl" style="font-size:21px;line-height:1.95;color:var(--text);text-align:right">وَٱلَّذِينَ يُؤْمِنُونَ بِمَآ أُنزِلَ إِلَيْكَ وَمَآ أُنزِلَ مِن قَبْلِكَ وَبِٱلْءَاخِرَةِ هُمْ يُوقِنُونَ</div>
          <div style="font-size:13.5px;line-height:1.6;color:var(--text2);margin-top:8px" data-en="And who believe in what has been revealed to you and what was revealed before you, and of the Hereafter they are certain." data-ar="والذين يصدِّقون بما أُنزل إليك وما أُنزل من قبلك، وهم بالآخرة موقنون."></div>
        </div>
      </div>
      <div style="height:1px;background:var(--line);margin:12px 0"></div>
    </div></div>
