<!-- ====== 06 · AYAH ACTION PANEL — PLAYBACK ====== -->
<div class="phone-col">
  <div class="phone-cap">
    <div class="n" data-en="Ayah Panel · Playback" data-ar="لوحة الآية · التشغيل"></div>
    <div class="d" data-en="Tab strip · From/To spinners · repeat 1–25 & ∞" data-ar="تبويبات · من/إلى · تكرار ١–٢٥ و∞"></div>
  </div>
  <div class="phone"><div class="notch"></div><div class="screen">
    <!-- reader page is sepia/immersive here — status bar sits on the paper -->
    <div class="sb on-paper" style="--paper:#F6ECCD;--paper-ink:#4a3b22"><span>9:41</span><span class="r"><span>5G</span><span class="sb-dots"></span><span>100</span></span></div>

    <div class="grow" style="position:relative;flex:1;overflow:hidden">
      <!-- reader page stays fully visible behind the panel (un-dimmed) -->
      <div class="page sepia">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 16px 0;font-size:11px;font-weight:700;color:var(--paper-ink);opacity:.6">
          <span class="ar">سُورَةُ الفَاتِحَة</span>
          <span data-en="Juz' 1" data-ar="الجزء ١"></span>
        </div>
        <div class="surah-band">سُورَةُ الفَاتِحَةِ</div>
        <div class="quran">
          بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ <span class="mk">1</span> <span style="background:var(--gold-faint);border-radius:6px;padding:0 2px">ٱلۡحَمۡدُ لِلَّهِ رَبِّ ٱلۡعَٰلَمِينَ <span class="mk">2</span></span> ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ <span class="mk">3</span> مَٰلِكِ يَوۡمِ ٱلدِّينِ <span class="mk">4</span> إِيَّاكَ نَعۡبُدُ وَإِيَّاكَ نَسۡتَعِينُ <span class="mk">5</span> ٱهۡدِنَا ٱلصِّرَٰطَ ٱلۡمُسۡتَقِيمَ <span class="mk">6</span>
        </div>
      </div>

      <!-- audio-range panel (navy slide-up; tabbed) -->
      <div class="sheet" style="background:var(--navy-900);box-shadow:0 -18px 40px -16px rgba(0,0,0,.55)">

        <!-- REVIVED icon tab strip (Play / Translation / Tag) + chevron collapse -->
        <div style="display:flex;align-items:center;padding:2px 8px 0">
          <div class="tabs" style="flex:1">
            <div class="tab on" title="Playback"><span style="font-size:18px">▶</span></div>
            <div class="tab" title="Translation"><span style="font-size:17px">🌐</span></div>
            <div class="tab" title="Tag / Bookmark"><span style="font-size:16px">🏷️</span></div>
          </div>
          <span title="Collapse" style="font-size:23px;font-weight:800;line-height:1;color:var(--on-navy);padding:8px 8px;flex:none">⌄</span>
        </div>

        <div class="pad" style="padding:6px 16px 18px">

          <!-- From — sura-name spinner (flex:2) + ayah-number spinner (flex:1) -->
          <div class="field" style="margin-top:6px">
            <div class="lab" style="color:var(--gold)" data-en="From" data-ar="من"></div>
            <div style="display:flex;gap:8px">
              <div style="flex:2;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--gold-semi);border-radius:11px;padding:9px 12px;color:var(--on-navy);font-size:13px">
                <span><span data-en="1." data-ar="١."></span> <span class="ar" style="font-size:14px">الفاتحة</span></span>
                <span style="color:var(--gold);font-size:10px">▼</span>
              </div>
              <div style="flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--gold-semi);border-radius:11px;padding:9px 12px;color:var(--on-navy);font-size:13px">
                <span data-en="2" data-ar="٢"></span>
                <span style="color:var(--gold);font-size:10px">▼</span>
              </div>
            </div>
          </div>

          <!-- To -->
          <div class="field">
            <div class="lab" style="color:var(--gold)" data-en="To" data-ar="إلى"></div>
            <div style="display:flex;gap:8px">
              <div style="flex:2;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--gold-semi);border-radius:11px;padding:9px 12px;color:var(--on-navy);font-size:13px">
                <span><span data-en="1." data-ar="١."></span> <span class="ar" style="font-size:14px">الفاتحة</span></span>
                <span style="color:var(--gold);font-size:10px">▼</span>
              </div>
              <div style="flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--gold-semi);border-radius:11px;padding:9px 12px;color:var(--on-navy);font-size:13px">
                <span data-en="7" data-ar="٧"></span>
                <span style="color:var(--gold);font-size:10px">▼</span>
              </div>
            </div>
          </div>

          <!-- repeat row 1 — PLAY SET OF VERSES (range). Wheel: ∞ · selected · next.
               choosing > 1 auto-checks "Only play the above verses" below. -->
          <div style="display:flex;align-items:center;gap:12px;margin-top:18px">
            <div style="flex:1;font-size:13.5px;font-weight:700;color:var(--on-navy)" data-en="Play set of verses:" data-ar="تشغيل مجموعة الآيات:"></div>
            <div dir="ltr" style="display:flex;align-items:flex-end;gap:16px">
              <span style="font-size:14px;color:var(--on-navy-dim);opacity:.55">∞</span>
              <span style="font-size:19px;font-weight:800;color:var(--gold);border-bottom:2px solid var(--gold);padding-bottom:2px;line-height:1.1"><span data-en="1" data-ar="١"></span></span>
              <span style="font-size:14px;color:var(--on-navy-dim);opacity:.55"><span data-en="2" data-ar="٢"></span></span>
            </div>
          </div>

          <!-- repeat row 2 — PLAY EACH VERSE (per-verse) -->
          <div style="display:flex;align-items:center;gap:12px;margin-top:14px">
            <div style="flex:1;font-size:13.5px;font-weight:700;color:var(--on-navy)" data-en="Play each verse:" data-ar="تشغيل كل آية:"></div>
            <div dir="ltr" style="display:flex;align-items:flex-end;gap:16px">
              <span style="font-size:14px;color:var(--on-navy-dim);opacity:.55">∞</span>
              <span style="font-size:19px;font-weight:800;color:var(--gold);border-bottom:2px solid var(--gold);padding-bottom:2px;line-height:1.1"><span data-en="1" data-ar="١"></span></span>
              <span style="font-size:14px;color:var(--on-navy-dim);opacity:.55"><span data-en="2" data-ar="٢"></span></span>
            </div>
          </div>

          <!-- only-play-selected checkbox (gold; unchecked, as in as-built) -->
          <div class="crow" style="padding:16px 2px 4px">
            <div class="cbx" style="border-color:rgba(255,255,255,.45)"></div>
            <div class="tx" style="flex:1">
              <div class="t" style="font-size:13px;font-weight:700;color:var(--on-navy)" data-en="Only play the above verses" data-ar="شغل ما تم اختياره من الآيات فقط"></div>
            </div>
          </div>

          <!-- primary action — GOLD, end-aligned. Dynamic label: default "Apply and Play";
               becomes "Apply" / "تطبيق" once playback is already running. -->
          <div style="display:flex;justify-content:flex-end;margin-top:14px">
            <button class="btn gold" style="border-radius:24px;padding:12px 26px" data-en="Apply and Play" data-ar="تطبيق وتشغيل"></button>
          </div>

        </div>
      </div>
    </div>
  </div></div>
</div>
