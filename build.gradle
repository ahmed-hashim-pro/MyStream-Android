// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '1.9.24'
    ext {
        kotlinVersion = '1.9.24'
        coroutinesVersion = '1.6.0'

        daggerVersion = '2.48.1'
        composeVersion = '1.1.0-rc01'
        composeCompilerVersion = '1.1.0-rc02'

        androidxMediaVersion = '1.5.0'
        androidxAnnotationVersion = '1.3.0'
        androidxFragmentVersion = '1.4.1'
        androidxPreferencesVersion = '1.2.0'
        androidxAppcompatVersion = '1.4.1'
        androidxLocalBroadcastVersion = '1.1.0'
        androidxSwipeRefreshVersion = '1.1.0'
        androidxRecyclerViewVersion = '1.2.1'
        androidxJunitExtVersion = '1.1.3'
        supportSqliteVersion = '2.1.0'
        workManagerVersion = '2.7.1'
        materialComponentsVersion = '1.5.0'
        coreKtxVersion = '1.7.0'

        anvilVersion = '2.4.9'
        moshiVersion = '1.15.1'
        okhttpVersion = '4.9.3'
        okioVersion = '3.0.0'
        retrofitVersion = '2.9.0'
        sqldelightVersion = '1.5.5'

        // testing
        junitVersion = '4.13.2'
        truthVersion = '1.1.3'
        espressoVersion = '3.4.0'

        deps = [
                android: [
                        build: [
                                minSdkVersion    : 21,
                                targetSdkVersion : 31,
                                compileSdkVersion: 33
                        ]
                ],
                dagger: [
                        apt: "com.google.dagger:dagger-compiler:${daggerVersion}",
                        runtime: "com.google.dagger:dagger:${daggerVersion}"
                ]
        ]
    }

    repositories {
        jcenter()
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        classpath 'com.google.firebase:perf-plugin:1.4.2'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.8.1'
        classpath 'com.google.gms:google-services:4.3.10'

        def nav_version = "2.5.3"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$nav_version"

        classpath "net.ltgt.gradle:gradle-errorprone-plugin:3.1.0"
        classpath "com.squareup.sqldelight:gradle-plugin:$sqldelightVersion"
        classpath "com.squareup.anvil:gradle-plugin:$anvilVersion"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // If you're using a version of Gradle lower than 4.1, you must instead use:
        maven {
            url 'https://maven.google.com'
        }
        maven { url 'https://jitpack.io' }
        jcenter()
    }
}

subprojects {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "1.8"
        }
    }
    afterEvaluate {
        if (plugins.hasPlugin('java') || plugins.hasPlugin('kotlin')) {
            java {
                sourceCompatibility = JavaVersion.VERSION_1_8
                targetCompatibility = JavaVersion.VERSION_1_8
            }
        }
    }
}
task clean(type: Delete) {
    delete rootProject.buildDir
}
