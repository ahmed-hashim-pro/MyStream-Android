// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '1.9.24'
    ext {
        kotlinVersion = '1.9.24'
        coroutinesVersion = '1.7.3'

        daggerVersion = '2.48.1'

        androidxMediaVersion = '1.7.0'
        androidxAnnotationVersion = '1.7.1'
        androidxFragmentVersion = '1.6.2'
        androidxPreferencesVersion = '1.2.1'
        androidxAppcompatVersion = '1.7.0'
        androidxLocalBroadcastVersion = '1.1.0'
        androidxSwipeRefreshVersion = '1.1.0'
        androidxRecyclerViewVersion = '1.3.2'
        androidxJunitExtVersion = '1.1.5'
        supportSqliteVersion = '2.3.1'
        workManagerVersion = '2.9.0'
        materialComponentsVersion = '1.11.0'
        coreKtxVersion = '1.12.0'
        lifecycleVersion = '2.7.0'
        navVersion = '2.7.7'

        anvilVersion = '2.4.9'
        moshiVersion = '1.15.1'
        okhttpVersion = '4.12.0'
        okioVersion = '3.7.0'
        retrofitVersion = '2.9.0'
        sqldelightVersion = '1.5.5'

        // testing
        junitVersion = '4.13.2'
        truthVersion = '1.4.0'
        espressoVersion = '3.5.1'

        deps = [
                android: [
                        build: [
                                minSdkVersion    : 21,
                                targetSdkVersion : 34,
                                compileSdkVersion: 34
                        ]
                ],
                dagger: [
                        apt: "com.google.dagger:dagger-compiler:${daggerVersion}",
                        runtime: "com.google.dagger:dagger:${daggerVersion}"
                ]
        ]
    }

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        classpath 'com.google.firebase:perf-plugin:1.4.2'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.9'
        classpath 'com.google.gms:google-services:4.4.0'

        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$navVersion"

        classpath "net.ltgt.gradle:gradle-errorprone-plugin:3.1.0"
        classpath "com.squareup.sqldelight:gradle-plugin:$sqldelightVersion"
        classpath "com.squareup.anvil:gradle-plugin:$anvilVersion"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

subprojects {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "1.8"
        }
    }
    afterEvaluate {
        if (plugins.hasPlugin('java') || plugins.hasPlugin('kotlin')) {
            java {
                sourceCompatibility = JavaVersion.VERSION_1_8
                targetCompatibility = JavaVersion.VERSION_1_8
            }
        }
    }
}
task clean(type: Delete) {
    delete rootProject.buildDir
}
